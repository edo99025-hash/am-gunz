<!doctype html>
<html lang="id" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hinata Activation</title><link rel="stylesheet" href="./assets/css/style.css">
</head><body>
<header><div class="wrap nav"><b>HINATA ACTIVATION</b><span>Bot / Temp Mail</span></div></header>
<main class="wrap">
<section class="hero"><small>AKTIVASI</small><h1>Aktivasi otomatis.</h1><p>Pilih email sendiri atau buat inbox temp-mail secara otomatis.</p></section>
<section class="card">
<div class="tabs"><button class="tab active" data-tab="temp">Temp Mail</button><button class="tab" data-tab="own">Email sendiri</button></div>
<div id="temp" class="panel">
<h2>Buat temp mail</h2><p>Masukkan jumlah. Maksimal 5 proses sekaligus.</p>
<div class="row"><input id="count" type="number" min="1" max="5" value="1"><button id="create" class="primary">Buat otomatis</button></div>
<div id="progress" class="progress"></div><div id="results" class="results"></div>
</div>
<div id="own" class="panel hidden">
<h2>Gunakan email sendiri</h2><p>Magic link tetap diverifikasi melalui API Hinata.</p>
<input id="email" type="email" placeholder="nama@email.com"><button id="send" class="primary full">Kirim magic link</button>
<div id="ownmsg" class="message"></div>
<div id="verifybox" class="hidden"><textarea id="magic" placeholder="Tempel magic link di sini"></textarea><button id="verify" class="primary full">Verifikasi</button></div>
</div>
</section>
</main><footer><div class="wrap">HINATA ACTIVATION</div></footer>
<script src="./assets/js/app.js"></script></body></html>
